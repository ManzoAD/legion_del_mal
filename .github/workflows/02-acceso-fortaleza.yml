name: Acceso a la Fortaleza Prohibida

on:  workflow_dispatch

jobs:
  acceso-a-la-base:
    runs-on: ubuntu-latest
    steps:
      - name: El agente llega a la fortaleza
        run: |
          echo "Agente ${{ github.actor }} ha llegado a la Fortaleza Prohibida."
          echo ""
          echo "Buscar los archivos de la Legion"
          ls -la
          echo ""
          echo "pero  que paso? no hay nada"
      
      - name: Brainiac desbloquea la bodeda
        uses : actions/checkout@v4

      - name: El agente busca los planes
        run: |
          echo "Buscar los archivos de la Legion"
          ls -la
          echo "Funciona"
          echo ""
          echo "Planes:"
          ls planes/
          echo "Villanos:"
          ls miembros/
          echo "Inteligencia:"
          ls inteligencia/