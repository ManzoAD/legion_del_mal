# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion


on:
  workflow_dispatch:
    inputs:
      villano:
        description: 'Que  villano envia el mensaje?'
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac
      prioridad:
        description: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - Normal
          - Media
          - Alta
          - Critica
      mensaje:
        description: 'Mensaje para el consejo'
        required: true
        default: 'La mision fue un exito'





jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "Villano: ${{ inputs.villano }}"
          echo "Prioridad: ${{ inputs.prioridad }}"
          echo "Mensaje: ${{ inputs.mensaje }}"

