# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion


on:
  workflow_dispatch:
    inputs:
      villano:
        description: 'Que  villano envia el mensaje?'
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac
      prioridad:
        description: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - Normal
          - Media
          - Alta
          - Critica
      cow-character:
        description: 'Selecciona el caracter'
        required: true
        type: choice
        options:
          - eyes
          - bong
          - bud-frogs
          - bunny
          - cheese
          - cower
          - dragon
          - elephant
          - ghostbusters
          - kitty
          - mech-and-cow
          - milk
          - moose
          - ren
          - sheep
          - skeleton

      mensaje:
        description: 'Mensaje para el consejo'
        required: true
        default: 'La mision fue un exito'





jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest
    
    steps:
      - name: Instalar el transmisor de la legion
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "================================"
          echo "      Transmision interceptada "
          echo "================================"
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +%d-%m-%Y - %H:%M:%S UTC)"
          echo "------- Mensaje------"
          cowsay -f ${{ inputs.cow-character }} "${{ inputs.mensaje }}"
          echo ""
          echo "---- ${{ inputs.villano }} "
          echo "..."

